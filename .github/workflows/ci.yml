name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # opencv-python tire des bibliotheques systeme absentes des images minimales.
      # Sans elles `import cv2` echoue AU CHARGEMENT, donc toute la suite est en erreur
      # de collecte -- pas en echec : la difference compte, un CI rouge pour cette raison
      # ne dit rien sur le code.
      - name: Dependances systeme d'OpenCV
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      - name: Installation
        # `typesafe-sdk` n'est PAS installe : aucun test ne doit sortir sur le reseau, et
        # c'est le meilleur endroit pour s'en assurer -- si un test en avait besoin, il
        # echouerait ici.
        run: pip install -e ".[dev]"

      - name: Tests
        run: pytest -q

      # --- Le cliquet qualite -----------------------------------------------
      # Le depot ne passe pas encore `mypy --strict` ni son propre jeu ruff. On ne bloque
      # pas le travail dessus, mais le compte ne REMONTE jamais : la base enregistree ne
      # fait que decroitre. Cf. CLAUDE.md section 3.
      - name: Cliquet ruff
        run: |
          base=$(grep '^ruff=' docs/QUALITY_BASELINE.txt | cut -d= -f2)
          found=$(ruff check . 2>&1 | grep -oE 'Found [0-9]+ error' | grep -oE '[0-9]+' || echo 0)
          echo "ruff : $found erreur(s), base $base"
          if [ "$found" -gt "$base" ]; then
            echo "::error::ruff est passe de $base a $found. Le cliquet interdit toute erreur NOUVELLE."
            ruff check .
            exit 1
          fi
          if [ "$found" -lt "$base" ]; then
            echo "::notice::ruff descend a $found : mettre docs/QUALITY_BASELINE.txt a jour."
          fi

      # mypy est INDICATIF, pas bloquant, et ce n'est pas un relachement : son compte
      # n'est pas reproductible d'un environnement a l'autre. Mesure -- 66 erreurs sur la
      # machine de developpement, 70 ici, sur le MEME commit. L'ecart vient des versions
      # de numpy et des stubs, pas du code.
      #
      # Un garde-fou qu'on ne peut pas reproduire en local ne garde rien : il rougit sur
      # des differences d'environnement, on prend l'habitude de passer outre, et le jour
      # ou il a raison plus personne ne l'ecoute. Ruff, lui, est stable et reste bloquant.
      #
      # Il redeviendra bloquant quand les deux comptes coincideront -- les outils sont
      # desormais epingles, ce qui en supprime la premiere cause.
      - name: mypy (indicatif)
        continue-on-error: true
        run: |
          base=$(grep '^mypy=' docs/QUALITY_BASELINE.txt | cut -d= -f2)
          found=$(mypy --strict src/ 2>&1 | grep -oE 'Found [0-9]+ error' | grep -oE '[0-9]+' || echo 0)
          echo "mypy : $found erreur(s) ici, $base sur la machine de reference"
          if [ "$found" -gt "$base" ]; then
            echo "::warning::mypy $found > base $base — a verifier en local avant de conclure"
          fi
